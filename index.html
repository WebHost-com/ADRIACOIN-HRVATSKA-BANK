    <style>
        /* LOGIN PAGE */

.loginpage {
    width: 420px;
    /* max-width: 90%; */
    padding: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;

    /* background: #ffffff; */
    border-radius: 24px;

    box-shadow: 0 15px 45px rgba(0, 0, 0, 0.10);

    font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell,
        "Open Sans", "Helvetica Neue", sans-serif;

    box-sizing: border-box;
}


/* TITLE */

.loginpage h2 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    color: #171717;
}


/* DESCRIPTION */

.loginpage > p {
    margin-top: 8px;
    margin-bottom: 30px;

    color: #777;
    font-size: 10px;
}


/* FORM */

.loginpage form {
    display: flex;
    flex-direction: column;
}


/* LABEL */

.loginpage label {
    margin-bottom: 8px;

    font-size: 14px;
    font-weight: 600;
    color: #333;
}


/* INPUT */

.loginpage input[type="text"],
.loginpage input[type="password"] {
    width: 100%;
    height: 52px;

    padding: 0 15px;
    margin-bottom: 20px;

    border: 1px solid #dddddd;
    border-radius: 12px;

    outline: none;

    font-size: 15px;
    color: #222;

    box-sizing: border-box;

    transition: 0.25s ease;
}


/* INPUT FOCUS */

.loginpage input[type="email"]:focus,
.loginpage input[type="password"]:focus {
    border-color: #ff6b00;

    box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.10);
}


/* FORGOT PASSWORD */

.forgot {
    text-align: right;
    margin-top: -5px;
    margin-bottom: 25px;
}

.forgot a {
    color: #000000;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
}

.forgot a:hover {
    text-decoration: underline;
}

/* SIGN IN BUTTON */

.loginpage button {
    width: 100%;
    height: 54px;

    border: none;
    border-radius: 12px;

    background: #030303;
    color: #ffffff;

    font-size: 16px;
    font-weight: 700;

    cursor: pointer;

    transition: 0.25s ease;
}


/* BUTTON HOVER */

.loginpage button:hover {
    background: #e85f00;
    transform: translateY(-2px);

    box-shadow: 0 8px 20px rgba(255, 107, 0, 0.25);
}


/* BUTTON CLICK */

.loginpage button:active {
    transform: translateY(0);
}


/* SIGN UP TEXT */

.loginpage form > p:nth-last-of-type(2) {
    margin-top: 25px;
    margin-bottom: 10px;

    text-align: center;

    color: #777;
    font-size: 14px;
}


/* SIGN UP */

.loginpage form > p:nth-last-of-type(2)::first-letter {
    color: #777;
}


/* LAST MESSAGE */

.loginpage form > p:last-child {
    margin: 0;

    text-align: center;

    color: #999;
    font-size: 12px;
    line-height: 1.5;
}
    </style>


<script>
const validUsername = "Sabaheta";
const validPassword = "1234567";

document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if (username === validUsername && password === validPassword) {
        alert("Login successful!");
        // Redirect to your protected page
        window.location.href = "landingpage.html";
    } else {
        alert("Invalid username or password.");
    }
});
</script>

</body>
